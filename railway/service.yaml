name: powerbin
_type: self-hosted
port: 8080
replication:
  connections:
    - type: postgresql
      uri: !env PS_DATA_SOURCE_URI
      sslmode: disable
storage:
  type: postgresql
  uri: !env PS_STORAGE_SOURCE_URI
  sslmode: disable
sync_config:
  path: sync-config.yaml
client_auth:
  audience: [powersync]
  jwks_uri: !env PS_JWKS_URI
  block_local_jwks: false
api:
  tokens: [!env PS_ADMIN_TOKEN]
